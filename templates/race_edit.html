{% extends "base.html" %}
{% block title %}レース編集{% endblock %}
{% block content %}
<h1>レース編集</h1>
<div class="card">
    <form action="/races/{{ race.id }}/edit" method="post" class="form-grid">
        <label class="full">レース名
            <input type="text" name="race_name" value="{{ race.race_name }}" required>
        </label>
        <label class="full">日付
            <input type="date" name="date" value="{{ race.date }}" required>
        </label>
        <label>開催場
            <select name="venue" required>
                {% for v in ["札幌","函館","福島","新潟","東京","中山","中京","京都","阪神","小倉"] %}
                <option value="{{ v }}" {% if v == race.venue %}selected{% endif %}>{{ v }}</option>
                {% endfor %}
            </select>
        </label>
        <label>レース番号
            <select name="race_number" required>
                {% for i in range(1, 13) %}
                <option value="{{ i }}" {% if i == race.race_number %}selected{% endif %}>{{ i }}R</option>
                {% endfor %}
            </select>
        </label>
        <label>芝・ダート
            <select name="surface" required>
                <option value="芝" {% if race.surface == "芝" %}selected{% endif %}>芝</option>
                <option value="ダート" {% if race.surface == "ダート" %}selected{% endif %}>ダート</option>
            </select>
        </label>
        <label>距離(m)
            <select name="distance" required>
                {% for d in range(1000, 3700, 100) %}
                <option value="{{ d }}" {% if d == race.distance %}selected{% endif %}>{{ d }}m</option>
                {% endfor %}
            </select>
        </label>
        <label>天気
            <select name="weather" required>
                {% for w in ["晴れ","曇り","小雨","雨"] %}
                <option value="{{ w }}" {% if w == race.weather %}selected{% endif %}>{{ w }}</option>
                {% endfor %}
            </select>
        </label>
        <label>馬場状態
            <select name="track_condition" required>
                {% for t in ["良","稍重","重","不良"] %}
                <option value="{{ t }}" {% if t == race.track_condition %}selected{% endif %}>{{ t }}</option>
                {% endfor %}
            </select>
        </label>
        <div class="full">
            <button type="submit">更新する</button>
        </div>
    </form>
</div>
{% endblock %}
