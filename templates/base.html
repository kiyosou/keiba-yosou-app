<!DOCTYPE html>
<html lang="ja" id="html-root">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}競馬予想アプリ{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app-layout">
    <aside class="sidebar">
        <h2>競馬予想アプリ</h2>
        <nav>
            <a href="/">ホーム</a>
            <a href="/search">検索</a>
            <a href="/races/add">レース登録</a>
            <a href="/horses/new">馬データ登録</a>
            <a href="/standard-times">基準タイム一覧</a>
            <a href="/races">レース一覧・ランキング</a>
            <a href="/horses">馬一覧</a>
            <a href="/results/input">結果入力</a>
            <a href="/results/list">結果一覧</a>
            <a href="/results/stats">的中率</a>
            <a href="/favorites">お気に入り馬</a>
        </nav>
        <button class="theme-toggle" onclick="toggleTheme()">🌙 ダークモード切替</button>
    </aside>
    <div class="main-content">
        {% block content %}{% endblock %}
    </div>
</div>
<script>
    const root = document.getElementById('html-root');
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') {
        root.setAttribute('data-theme', 'dark');
    }
    function toggleTheme() {
        const isDark = root.getAttribute('data-theme') === 'dark';
        if (isDark) {
            root.removeAttribute('data-theme');
            localStorage.setItem('theme', 'light');
        } else {
            root.setAttribute('data-theme', 'dark');
            localStorage.setItem('theme', 'dark');
        }
    }
</script>
</body>
</html>
